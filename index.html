<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — Marketing Career DNA Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070709;
    --surface: #0f0f13;
    --surface-hover: #16161c;
    --border: #22222a;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --accent3: #7b61ff;
    --text: #f0f0f5;
    --text-muted: #5a5a6a;
    --text-dim: #9d9dae;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    height: 100vh;
    overflow: hidden; /* App-like fixed screen canvas */
    user-select: none;
  }

  /* ── Canvas Background & Particles ── */
  #canvas-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* NOISE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.35;
  }

  /* ── SCREEN SYSTEM ── */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    transform: scale(0.98) translateY(10px);
    z-index: 1;
    overflow-y: auto;
  }

  .screen.active {
    opacity: 1;
    pointer-events: all;
    transform: scale(1) translateY(0);
    z-index: 2;
  }

  /* Custom Scrollbar for screens */
  .screen::-webkit-scrollbar { width: 5px; }
  .screen::-webkit-scrollbar-track { background: transparent; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── LANDING SCREEN ── */
  #screen-landing {
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
    text-align: center;
  }

  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    pointer-events: none;
  }
  .orb1 { width: 550px; height: 550px; background: rgba(232,255,71,0.06); top: -200px; right: -100px; }
  .orb2 { width: 450px; height: 450px; background: rgba(123,97,255,0.08); bottom: -100px; left: -100px; }

  .landing-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(232,255,71,0.3);
    background: rgba(232,255,71,0.03);
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 32px;
    box-shadow: 0 0 20px rgba(232,255,71,0.1);
  }

  .landing-title {
    font-family: var(--font-display);
    font-size: clamp(64px, 12vw, 130px);
    font-weight: 800;
    line-height: 0.85;
    letter-spacing: -0.04em;
    margin-bottom: 12px;
    text-shadow: 0 10px 40px rgba(0,0,0,0.8);
  }

  .landing-title span { 
    color: var(--accent);
    display: inline-block;
    position: relative;
  }

  .landing-subtitle {
    font-family: var(--font-display);
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: -0.01em;
    margin-bottom: 48px;
    max-width: 600px;
  }

  .landing-meta {
    display: flex;
    gap: 32px;
    margin-bottom: 48px;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }

  .meta-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .btn-primary {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 20px 48px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    box-shadow: 0 0 30px rgba(232,255,71,0.25);
  }

  .btn-primary:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 40px rgba(232,255,71,0.4);
    background: #f1ff70;
  }

  .btn-primary:active { transform: translateY(-1px) scale(0.99); }

  .landing-signature {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    opacity: 0.6;
  }

  /* ── TEST SCREEN (SINGLE PAGE CARD-STACK INTERACTION) ── */
  #screen-test {
    justify-content: space-between;
  }

  .test-header {
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(7,7,9,0.8);
    backdrop-filter: blur(12px);
    z-index: 10;
  }

  .test-logo {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .progress-container {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress-bar-wrap {
    width: 220px;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 10px var(--accent);
  }

  .progress-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    min-width: 55px;
    text-align: right;
  }

  .test-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }

  /* Single Card Slide Box */
  .card-viewport {
    width: 100%;
    max-width: 820px;
    position: relative;
    min-height: 520px;
  }

  .q-card {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transform: translateY(30px) scale(0.97);
    transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .q-card.active {
    opacity: 1;
    pointer-events: all;
    transform: translateY(0) scale(1);
  }

  .q-card.exit-left {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-60px) scale(0.95);
  }

  .q-card.enter-right {
    opacity: 0;
    pointer-events: none;
    transform: translateX(60px) scale(0.95);
  }

  .question-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .question-tag::before {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: var(--accent);
  }

  .question-scenario {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-dim);
    border-left: 2px solid var(--accent3);
    padding: 10px 0 10px 18px;
    margin-bottom: 24px;
    background: rgba(123,97,255,0.03);
    border-radius: 0 4px 4px 0;
  }

  .question-text {
    font-family: var(--font-display);
    font-size: clamp(20px, 2.5vw, 26px);
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }

  .options-grid {
    display: grid;
    gap: 10px;
  }

  .option-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px 20px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .option-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(232,255,71,0.08), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .option-card:hover {
    border-color: rgba(232,255,71,0.5);
    background: var(--surface-hover);
    transform: translateX(6px);
  }

  .option-card:hover::before { opacity: 1; }

  .option-card.selected {
    border-color: var(--accent);
    background: rgba(232,255,71,0.06);
    box-shadow: 0 0 15px rgba(232,255,71,0.1);
  }

  .option-card.selected::before { opacity: 1; }

  .option-letter {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    border: 1px solid rgba(232,255,71,0.3);
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .option-card.selected .option-letter {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 10px var(--accent);
  }

  .option-text {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }

  .test-footer {
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    background: rgba(7,7,9,0.8);
    backdrop-filter: blur(12px);
    z-index: 10;
  }

  .btn-secondary {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 12px 24px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .btn-secondary:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }
  .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-next {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px 32px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    opacity: 0.3;
    pointer-events: none;
  }

  .btn-next.enabled { opacity: 1; pointer-events: all; }
  .btn-next.enabled:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,255,71,0.3); }

  /* ── RESULT SCREEN ── */
  #screen-result {
    padding-bottom: 60px;
  }

  .result-header {
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(7,7,9,0.9);
    backdrop-filter: blur(16px);
    z-index: 100;
  }

  .result-hero {
    padding: 60px 40px 40px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .result-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .result-eyebrow::before {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background: var(--text-muted);
  }

  .result-archetype-name {
    font-family: var(--font-display);
    font-size: clamp(44px, 8vw, 84px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 20px;
  }

  .result-slogan {
    font-family: var(--font-body);
    font-size: clamp(18px, 2.5vw, 24px);
    font-weight: 300;
    font-style: italic;
    color: var(--accent);
    margin-bottom: 40px;
    max-width: 650px;
    line-height: 1.4;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto 40px;
    padding: 0 40px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px;
    transition: transform 0.3s;
  }

  .result-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }

  .result-card-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .result-card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .result-card p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-dim);
    font-weight: 300;
  }

  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }

  .skill-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    padding: 6px 12px;
    border-radius: 4px;
    color: var(--text-dim);
  }

  .skill-tag.highlight {
    border-color: rgba(232,255,71,0.4);
    color: var(--accent);
    background: rgba(232,255,71,0.04);
  }

  .failure-card {
    background: rgba(255,107,53,0.04);
    border: 1px solid rgba(255,107,53,0.25);
  }

  .failure-card .result-card-label { color: rgba(255,107,53,0.8); }

  .score-bar-section {
    max-width: 1000px;
    margin: 0 auto 40px;
    padding: 0 40px;
  }

  .score-bars {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 20px;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .score-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    width: 190px;
    flex-shrink: 0;
  }

  .score-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    width: 0;
  }

  .score-pct {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 40px;
    text-align: right;
  }

  .career-path {
    max-width: 1000px;
    margin: 0 auto 60px;
    padding: 0 40px;
  }

  .path-track {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .path-node {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: 6px;
    position: relative;
  }

  .path-node.active {
    background: rgba(232,255,71,0.03);
    border-color: rgba(232,255,71,0.3);
  }

  .path-level {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .path-role {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .path-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .section-skills {
    max-width: 1000px;
    margin: 0 auto 60px;
    padding: 0 40px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .next-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .next-step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
  }

  .step-num {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1;
    margin-bottom: 12px;
  }

  .step-title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .step-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .step-items li {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    padding-left: 14px;
    position: relative;
  }

  .step-items li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 10px;
  }

  .result-footer {
    border-top: 1px solid var(--border);
    padding: 32px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1000px;
    margin: 0 auto;
  }

  .btn-retake {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 12px 28px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .btn-retake:hover { color: var(--text); border-color: var(--text-dim); background: var(--surface); }

  @media (max-width: 768px) {
    .test-header, .test-footer, .result-header, .result-hero, .result-grid, .score-bar-section, .career-path, .section-skills, .result-footer {
      padding-left: 20px;
      padding-right: 20px;
    }
    .result-grid, .next-steps, .path-track { grid-template-columns: 1fr; flex-direction: column; }
    .card-viewport { min-height: 600px; }
  }
</style>
</head>
<body>

<!-- Interactive Particle Canvas Background -->
<canvas id="canvas-bg"></canvas>

<!-- ════════════════════════════════ LANDING ════════════════════════════════ -->
<div id="screen-landing" class="screen active">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <div class="landing-badge">Marketing Career Intelligence · 2026 Edition</div>

  <h1 class="landing-title">SIG<span>NAL</span></h1>
  <p class="landing-subtitle">Discover your Marketing DNA in 10 questions</p>

  <div class="landing-meta">
    <div class="meta-item"><div class="meta-dot"></div> 10 QUESTIONS</div>
    <div class="meta-item"><div class="meta-dot"></div> ~5 MINUTES</div>
    <div class="meta-item"><div class="meta-dot"></div> 4 ARCHETYPES</div>
    <div class="meta-item"><div class="meta-dot"></div> FREE REPORT</div>
  </div>

  <button class="btn-primary" onclick="startTest()">FIND YOUR TYPE →</button>

  <div class="landing-signature">A creation by Siwen Huang</div>
</div>

<!-- ════════════════════════════════ TEST ════════════════════════════════ -->
<div id="screen-test" class="screen">
  <div class="test-header">
    <div class="test-logo">SIGNAL</div>
    <div class="progress-container">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">1 / 10</div>
    </div>
  </div>

  <div class="test-stage">
    <div class="card-viewport" id="card-viewport">
      <!-- Question Cards will be injected dynamically -->
    </div>
  </div>

  <div class="test-footer">

const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
let width, height, particles = [];

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.size = Math.random() * 1.5 + 0.5;
    this.alpha = Math.random() * 0.4 + 0.1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0) this.x = width;
    if (this.x > width) this.x = 0;
    if (this.y < 0) this.y = height;
    if (this.y > height) this.y = 0;
  }
  draw() {
    ctx.fillStyle = `rgba(232, 255, 71, ${this.alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

for (let i = 0; i < 45; i++) particles.push(new Particle());

function renderCanvas() {
  ctx.clearRect(0, 0, width, height);
  // Grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.015)';
  ctx.lineWidth = 1;
  const step = 60;
  for (let x = 0; x < width; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
  }
  for (let y = 0; y < height; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
  }

  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(renderCanvas);
}
renderCanvas();

function showScreen(id) {

function startTest() {
  currentQuestion = 0;
  answers = Array(QUESTIONS.length).fill(null);

  updateQuestionState();

function renderCardStack() {
  const viewport = document.getElementById('card-viewport');
  viewport.innerHTML = '';

  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = `q-card ${idx === 0 ? 'active' : ''}`;
    card.id = `q-card-${idx}`;

    card.innerHTML = `
      <div class="question-tag">QUESTION ${idx + 1} OF ${QUESTIONS.length}</div>
      <div class="question-scenario">${q.scenario}</div>
      <div class="question-text">${q.q}</div>
      <div class="options-grid">
        ${q.options.map((opt, oIdx) => `
          <div class="option-card" data-letter="${opt.letter}" onclick="selectOption(${idx}, '${opt.letter}')">
            <div class="option-letter">${opt.letter}</div>
            <div class="option-text">${opt.text}</div>
          </div>
        `).join('')}
      </div>
    `;
    viewport.appendChild(card);
  });
}

function selectOption(qIdx, letter) {
  answers[qIdx] = letter;
  const card = document.getElementById(`q-card-${qIdx}`);
  card.querySelectorAll('.option-card').forEach(opt => {
    if (opt.dataset.letter === letter) {
      opt.classList.add('selected');
    } else {
      opt.classList.remove('selected');
    }
  });

  document.getElementById('btn-next').classList.add('enabled');

  // Auto-advance after brief delay for crisp UX
  setTimeout(() => {
    if (currentQuestion < QUESTIONS.length - 1) {
      nextQuestion();
    } else {
      finishTest();
    }
  }, 220);
}

function updateQuestionState() {
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');
  const pct = ((currentQuestion + 1) / QUESTIONS.length) * 100;
  fill.style.width = `${pct}%`;
  label.innerText = `${currentQuestion + 1} / ${QUESTIONS.length}`;

  document.getElementById('btn-prev').disabled = currentQuestion === 0;

  const nextBtn = document.getElementById('btn-next');
  if (answers[currentQuestion]) {
    nextBtn.classList.add('enabled');
  } else {
    nextBtn.classList.remove('enabled');
  }
}

function nextQuestion() {
  if (currentQuestion >= QUESTIONS.length - 1) {
    finishTest();
    return;
  }
  
  const currentCard = document.getElementById(`q-card-${currentQuestion}`);
  currentCard.className = 'q-card exit-left';

  currentQuestion++;
  
  const nextCard = document.getElementById(`q-card-${currentQuestion}`);
  nextCard.className = 'q-card enter-right';
  
  // Force reflow
  void nextCard.offsetWidth;
  nextCard.className = 'q-card active';

  updateQuestionState();
}

function prevQuestion() {
  if (currentQuestion <= 0) return;

  const currentCard = document.getElementById(`q-card-${currentQuestion}`);
  currentCard.className = 'q-card enter-right';

  currentQuestion--;

  const prevCard = document.getElementById(`q-card-${currentQuestion}`);
  prevCard.className = 'q-card exit-left';

  void prevCard.offsetWidth;
  prevCard.className = 'q-card active';

  updateQuestionState();
}

function finishTest() {
  showScreen('screen-result');
  calculateResult();
}
