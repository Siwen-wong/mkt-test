<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — Marketing Career DNA Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #181818;
    --border: #242424;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --accent3: #7b61ff;
    --text: #f0f0f0;
    --text-muted: #666;
    --text-dim: #999;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NOISE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ── LANDING ── */
  #screen-landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
  }
  .orb1 { width: 500px; height: 500px; background: rgba(232,255,71,0.06); top: -200px; right: -100px; }
  .orb2 { width: 400px; height: 400px; background: rgba(123,97,255,0.08); bottom: -100px; left: -100px; }

  .landing-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(232,255,71,0.3);
    padding: 6px 14px;
    border-radius: 2px;
    margin-bottom: 40px;
    animation: fadeUp 0.6s ease both;
  }

  .landing-title {
    font-family: var(--font-display);
    font-size: clamp(56px, 10vw, 120px);
    font-weight: 800;
    line-height: 0.9;
    text-align: center;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .landing-title span { color: var(--accent); }

  .landing-subtitle {
    font-family: var(--font-display);
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 400;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: -0.01em;
    margin-bottom: 64px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .landing-meta {
    display: flex;
    gap: 32px;
    margin-bottom: 48px;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .meta-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .btn-primary {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 18px 48px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    animation: fadeUp 0.6s 0.4s ease both;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.15);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-primary:hover::after { opacity: 1; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(232,255,71,0.3); }
  .btn-primary:active { transform: translateY(0); }

  .landing-signature {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    white-space: nowrap;
    animation: fadeUp 0.6s 0.6s ease both;
    opacity: 0.5;
  }

  /* ── QUESTION SCREEN ── */
  #screen-test {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .test-header {
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .test-logo {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  .progress-container {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress-bar-wrap {
    width: 200px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .progress-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    min-width: 50px;
    text-align: right;
  }

  .test-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 40px;
    width: 100%;
  }

  .question-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .question-tag::before {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--accent);
  }

  .question-scenario {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 300;
    line-height: 1.7;
    color: var(--text-dim);
    border-left: 2px solid var(--border);
    padding-left: 20px;
    margin-bottom: 32px;
    font-style: italic;
  }

  .question-text {
    font-family: var(--font-display);
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: 40px;
  }

  .options-grid {
    display: grid;
    gap: 12px;
  }

  .option-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 22px 24px;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: flex-start;
    gap: 18px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .option-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(232,255,71,0.04), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .option-card:hover {
    border-color: rgba(232,255,71,0.4);
    transform: translateX(4px);
  }

  .option-card:hover::before { opacity: 1; }

  .option-card.selected {
    border-color: var(--accent);
    background: rgba(232,255,71,0.05);
  }

  .option-card.selected::before { opacity: 1; }

  .option-letter {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    border: 1px solid rgba(232,255,71,0.3);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }

  .option-card.selected .option-letter {
    background: var(--accent);
    color: #000;
  }

  .option-text {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text);
    padding-top: 4px;
  }

  .test-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }

  .btn-secondary {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 12px 28px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }

  .btn-next {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 14px 36px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    opacity: 0.3;
    pointer-events: none;
  }

  .btn-next.enabled { opacity: 1; pointer-events: all; }
  .btn-next.enabled:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,255,71,0.3); }

  /* TRANSITION ANIMATION */
  .question-slide {
    animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1) both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(32px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── RESULT SCREEN ── */
  #screen-result {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  .result-header {
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .result-hero {
    padding: 80px 40px 60px;
    max-width: 1000px;
    margin: 0 auto;
    position: relative;
  }

  .result-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .result-eyebrow::before {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background: var(--text-muted);
  }

  .result-archetype-name {
    font-family: var(--font-display);
    font-size: clamp(40px, 7vw, 88px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }

  .result-slogan {
    font-family: var(--font-body);
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 300;
    font-style: italic;
    color: var(--accent);
    margin-bottom: 60px;
    max-width: 600px;
    line-height: 1.4;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto 40px;
    padding: 0 40px;
  }

  @media (max-width: 700px) {
    .result-grid { grid-template-columns: 1fr; }
    .result-hero { padding: 40px 24px; }
    .result-grid { padding: 0 24px; }
    .section-skills { padding: 0 24px; }
    .test-body { padding: 40px 24px; }
    .landing-meta { flex-direction: column; gap: 12px; align-items: center; }
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 28px;
  }

  .result-card-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .result-card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .result-card p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-dim);
    font-weight: 300;
  }

  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }

  .skill-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 2px;
    color: var(--text-dim);
    transition: all 0.2s;
  }

  .skill-tag.highlight {
    border-color: rgba(232,255,71,0.4);
    color: var(--accent);
  }

  .failure-card {
    background: rgba(255,107,53,0.05);
    border: 1px solid rgba(255,107,53,0.2);
  }

  .failure-card .result-card-label { color: rgba(255,107,53,0.6); }

  .section-skills {
    max-width: 1000px;
    margin: 0 auto 60px;
    padding: 0 40px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title span {
    font-size: 12px;
    font-weight: 400;
    font-family: var(--font-mono);
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .next-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  @media (max-width: 700px) {
    .next-steps { grid-template-columns: 1fr; }
    .result-grid { grid-template-columns: 1fr; }
  }

  .next-step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 24px;
  }

  .step-num {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 300;
    color: var(--border);
    line-height: 1;
    margin-bottom: 12px;
  }

  .step-title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .step-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .step-items li {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    padding-left: 14px;
    position: relative;
  }

  .step-items li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 10px;
  }

  .career-path {
    max-width: 1000px;
    margin: 0 auto 80px;
    padding: 0 40px;
  }

  .path-track {
    display: flex;
    gap: 0;
    align-items: stretch;
    margin-top: 24px;
  }

  .path-node {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    position: relative;
  }

  .path-node:first-child { border-radius: 3px 0 0 3px; }
  .path-node:last-child { border-radius: 0 3px 3px 0; }

  .path-node + .path-node {
    border-left: none;
  }

  .path-node.active {
    background: rgba(232,255,71,0.04);
    border-color: rgba(232,255,71,0.3);
  }

  .path-level {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .path-role {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .path-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .path-arrow {
    font-size: 16px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    padding: 0 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    width: 0;
  }

  @media (max-width: 700px) {
    .path-track { flex-direction: column; }
    .path-node:first-child { border-radius: 3px 3px 0 0; }
    .path-node:last-child { border-radius: 0 0 3px 3px; }
    .path-node + .path-node { border-left: 1px solid var(--border); border-top: none; }
    .career-path { padding: 0 24px; }
  }

  .score-bar-section {
    max-width: 1000px;
    margin: 0 auto 40px;
    padding: 0 40px;
  }

  @media (max-width: 700px) {
    .score-bar-section { padding: 0 24px; }
  }

  .score-bars {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 20px;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .score-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    width: 180px;
    flex-shrink: 0;
  }

  .score-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 1s cubic-bezier(0.4,0,0.2,1);
    width: 0;
  }

  .score-fill.secondary { background: var(--accent3); }
  .score-fill.tertiary { background: var(--accent2); }

  .score-pct {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 36px;
    text-align: right;
  }

  .result-footer {
    border-top: 1px solid var(--border);
    padding: 32px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: gap;
  }

  .result-footer-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  .btn-retake {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 10px 24px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn-retake:hover { color: var(--text); border-color: var(--text-dim); }

  .archetype-color-A { color: #e8ff47; }
  .archetype-color-B { color: #7b61ff; }
  .archetype-color-C { color: #ff6b35; }
  .archetype-color-D { color: #47ffe8; }

  .accent-bar {
    display: inline-block;
    width: 40px;
    height: 4px;
    border-radius: 2px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<!-- ════════════════════════════════ LANDING ════════════════════════════════ -->
<div id="screen-landing" class="screen active">
  <div class="bg-grid"></div>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <div class="landing-badge">Marketing Career Intelligence · 2026 Edition</div>

  <h1 class="landing-title">SIG<span>NAL</span></h1>
  <p class="landing-subtitle">Discover your Marketing DNA in 10 questions</p>

  <div class="landing-meta">
    <div class="meta-item"><div class="meta-dot"></div> 10 QUESTIONS</div>
    <div class="meta-item"><div class="meta-dot"></div> ~5 MINUTES</div>
    <div class="meta-item"><div class="meta-dot"></div> 4 ARCHETYPES</div>
    <div class="meta-item"><div class="meta-dot"></div> FREE REPORT</div>
  </div>

  <button class="btn-primary" onclick="startTest()">FIND YOUR TYPE →</button>

  <div class="landing-signature">A creation by Siwen Huang</div>
</div>

<!-- ════════════════════════════════ TEST ════════════════════════════════ -->
<div id="screen-test" class="screen">
  <div class="test-header">
    <div class="test-logo">SIGNAL</div>
    <div class="progress-container">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">0 / 10</div>

let current = 0;

let selected = null;   // currently selected display index (0-3)
let shuffleMap = [];   // per-question: shuffleMap[q] = [archetypeKey, ...] in display order

/* ───────────────────────────────────────────────────────────────
   SHUFFLE HELPER
   Generates a per-question random display order, seeded once at
   test start so back-navigation shows the same order.
─────────────────────────────────────────────────────────────── */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffleMaps() {
  // Archetype order in QUESTIONS data is always A, B, C, D
  // shuffleMap[i] = array of archetype keys in the random display order for question i
  shuffleMap = QUESTIONS.map(() => shuffleArray(['A', 'B', 'C', 'D']));
}

/* ───────────────────────────────────────────────────────────────
   NAVIGATION
─────────────────────────────────────────────────────────────── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0,0);
}

function startTest() {
  current = 0;
  answers = [];
  selected = null;
  buildShuffleMaps();
  show('test');
  renderQuestion();
}

/* ───────────────────────────────────────────────────────────────
   RENDER QUESTION
   Display letters are purely cosmetic (A/B/C/D in display order).
   Each rendered option carries a data-archetype attribute for scoring.
─────────────────────────────────────────────────────────────── */
function renderQuestion() {
  const q = QUESTIONS[current];
  selected = null;

  const fill = ((current) / QUESTIONS.length) * 100;
  document.getElementById('progress-fill').style.width = fill + '%';
  document.getElementById('progress-label').textContent = `${current} / ${QUESTIONS.length}`;

  // Build display-order options using this question's shuffle map
  // shuffleMap[current] = ['C','A','D','B'] (example) — archetype keys in display order
  const displayLetters = ['A', 'B', 'C', 'D'];
  const archetypeOrder = shuffleMap[current]; // e.g. ['C','A','D','B']

  // Original QUESTIONS options are stored in fixed order: index 0=A, 1=B, 2=C, 3=D
  const archetypeIndexMap = { A: 0, B: 1, C: 2, D: 3 };

  const optionsHTML = archetypeOrder.map((archetypeKey, displayIdx) => {
    const origOption = q.options[archetypeIndexMap[archetypeKey]];
    return `
      <div class="option-card" onclick="selectOption(${displayIdx})" id="opt-${displayIdx}" data-archetype="${archetypeKey}">
        <div class="option-letter">${displayLetters[displayIdx]}</div>
        <div class="option-text">${origOption.text}</div>
      </div>
    `;
  }).join('');

  const html = `
    <div class="question-slide">
      <div class="question-tag">Question ${current + 1} of ${QUESTIONS.length}</div>
      <div class="question-scenario">${q.scenario}</div>
      <div class="question-text">${q.prompt}</div>
      <div class="options-grid">
        ${optionsHTML}
      </div>
      <div class="test-nav">
        <button class="btn-secondary" onclick="goBack()" ${current === 0 ? 'style="opacity:0.3;pointer-events:none"' : ''}>← BACK</button>
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">
          ${current < QUESTIONS.length - 1 ? 'NEXT →' : 'SEE RESULTS →'}
        </button>
      </div>
    </div>
  `;

  document.getElementById('test-body').innerHTML = html;

  // If navigating back, restore the previously selected display position
  if (answers[current] !== undefined) {
    const prevArchetype = answers[current];
    const prevDisplayIdx = shuffleMap[current].indexOf(prevArchetype);
    if (prevDisplayIdx !== -1) selectOption(prevDisplayIdx);
  }
}

function selectOption(displayIdx) {
  selected = displayIdx;
  document.querySelectorAll('.option-card').forEach((c, idx) => {
    c.classList.toggle('selected', idx === displayIdx);
  });
  document.getElementById('btn-next').classList.add('enabled');
}

function nextQuestion() {
  if (selected === null) return;
  // Resolve selected display position → archetype key via shuffleMap
  const archetypeKey = shuffleMap[current][selected];
  answers[current] = archetypeKey; // store archetype key, not display index
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function goBack() {
  if (current === 0) return;
  current--;
  renderQuestion(); // renderQuestion re-applies the saved answer visually
}

/* ───────────────────────────────────────────────────────────────
   CALCULATE RESULT
   answers[] now contains archetype keys directly — no index math needed
─────────────────────────────────────────────────────────────── */
function showResults() {
  const scores = { A: 0, B: 0, C: 0, D: 0 };
  answers.forEach(key => { if (scores[key] !== undefined) scores[key]++; });

  const winner = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const archetype = ARCHETYPES[winner];

  const total = answers.length;
  const pcts = {};
  Object.keys(scores).forEach(k => pcts[k] = Math.round((scores[k] / total) * 100));

  renderResult(archetype, pcts);
  show('result');

  setTimeout(() => {
    Object.keys(pcts).forEach(k => {
      const el = document.getElementById(`score-bar-${k}`);
      if (el) el.style.width = pcts[k] + '%';
    });
  }, 300);
}

        ${Object.entries(ARCHETYPES).map(([k, arch]) => `
          <div class="score-row">
            <div class="score-label">${arch.emoji} ${arch.name}</div>
            <div class="score-track">
              <div class="score-fill ${scoreColorClass(k)}" id="score-bar-${k}"></div>
            </div>
            <div class="score-pct">${pcts[k]}%</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- MAIN CARDS -->
    <div class="result-grid">
      <div class="result-card" style="grid-column: 1 / -1">
        <div class="result-card-label">Career Profile</div>
        <p>${a.description}</p>
      </div>

      <div class="result-card">
        <div class="result-card-label">Core Capability Stack</div>
        <div class="skill-tags">
          ${a.stack.map(s => `<span class="skill-tag highlight">${s}</span>`).join('')}
        </div>
      </div>

      <div class="result-card">
        <div class="result-card-label">Team Role</div>
        <p>${a.teamRole}</p>
      </div>

      <div class="result-card">
        <div class="result-card-label">You're Drawn To</div>
        <div class="skill-tags">
          ${a.likes.map(s => `<span class="skill-tag">${s}</span>`).join('')}
        </div>
      </div>

      <div class="result-card failure-card">
        <div class="result-card-label">Failure Mode ⚠</div>
        <p>${a.failure}</p>
      </div>
    </div>

    <!-- NEXT STEPS -->
    <div class="section-skills">
      <div class="section-title">Your Next Moves <span>ACTIONABLE STEPS</span></div>
      <div class="next-steps">
        <div class="next-step-card">
          <div class="step-num">01</div>
          <div class="step-title">Master These Tools</div>
          <ul class="step-items">
            ${a.tools.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>
        <div class="next-step-card">
          <div class="step-num">02</div>
          <div class="step-title">Study These</div>
          <ul class="step-items">
            ${a.learn.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>
        <div class="next-step-card">
          <div class="step-num">03</div>
          <div class="step-title">Target These Roles</div>
          <ul class="step-items">
            ${a.targets.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>
      </div>
    </div>

    <!-- CAREER PATH -->
    <div class="career-path">
      <div class="section-title">Career Trajectory <span>WHERE THIS GOES</span></div>
      <div class="path-track">
        ${a.path.map((p, i) => `
          <div class="path-node ${i === 0 ? 'active' : ''}">
            <div class="path-level">${p.level}</div>
            <div class="path-role" style="${i === 0 ? 'color:' + a.color : ''}">${p.role}</div>
            <div class="path-desc">${p.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- FOOTER -->
    <div class="result-footer">
      <div class="result-footer-text">SIGNAL · MARKETING CAREER INTELLIGENCE · 2026</div>
      <button class="btn-retake" onclick="startTest()">↺ RETAKE TEST</button>
    </div>
  `;

  document.getElementById('result-content').innerHTML = html;
}
</script>
</body>
</html>
